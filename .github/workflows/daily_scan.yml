name: daily_scan

on:
  schedule:
    # 以下均为北京时间（GitHub cron 用 UTC，已减 8 小时）
    - cron: '30 2 * * 1-5'    # 10:30 上午盘中
    - cron: '30 5 * * 1-5'    # 13:30 下午开盘
    - cron: '30 6 * * 1-5'    # 14:30 尾盘前
    - cron: '40 7 * * 1-5'    # 15:40 收盘确认
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 每日扫描并推送预警
        run: python gha_scan.py
        env:
          SCKEY: ${{ secrets.SCKEY }}
