name: daily_scan

on:
  schedule:
    # UTC 07:40 = 北京时间 15:40（A 股收盘后，周一到周五）
    - cron: '40 7 * * 1-5'
  workflow_dispatch:   # 支持在 GitHub 网页上手动触发

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 每日扫描并推送预警
        run: python gha_scan.py
        env:
          SCKEY: ${{ secrets.SCKEY }}
